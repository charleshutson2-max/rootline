<!DOCTYPE html>
<html lang="en" data-base="..">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Invite code — Rootline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body data-shell="member" data-active="me">
  <div class="rl-app-bar" data-rl-app-bar></div>
  <main class="rl-main rl-main--narrow">

    <p class="eyebrow">Path A · Invite</p>
    <h1>Enter invite code</h1>
    <p class="lede">Codes from Members usually need Steward confirmation. Steward-issued codes may auto-approve (still audited).</p>
    <form class="card" onsubmit="event.preventDefault(); const c=document.getElementById('code').value.trim(); if(c.toUpperCase()==='SAMPLE-JOIN'){ location.href='onboarding.html'; } else { alert('Prototype: try SAMPLE-JOIN'); }">
      <div class="field">
        <label for="code">Invite code</label>
        <input id="code" type="text" autocomplete="off" placeholder="SAMPLE-JOIN" style="letter-spacing:0.08em;font-weight:600;" />
        <p class="hint">Demo code: <code>SAMPLE-JOIN</code></p>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Continue</button>
    </form>
    <p style="margin-top:1.25rem;"><a href="request-access.html">No code? Request access instead</a></p>

  </main>
  <script src="../js/app.js"></script>
  
</body>
</html>
