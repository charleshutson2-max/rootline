<!DOCTYPE html>
<html lang="en" data-base="..">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Record a memory — Rootline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body data-shell="member" data-active="stories">
  <div class="rl-app-bar" data-rl-app-bar></div>
  <main class="rl-main rl-main--narrow">

    <p class="eyebrow">Propose</p>
    <h1>Record a memory</h1>
    <p class="lede">Members propose; Stewards approve. Voice transcripts mark “needs Steward attach” before Ask Rootline can use them.</p>
    <form class="card" onsubmit="event.preventDefault(); alert('Prototype: memory proposal queued for Steward.');">
      <div class="field">
        <label for="about">About whom</label>
        <select id="about">
          <option>SAMPLE Eleanor Mae Norwood</option>
          <option>SAMPLE Samuel Hutson</option>
          <option>SAMPLE Margaret Norwood Hutson</option>
          <option>SAMPLE Charlie Hutson (living — owner notified)</option>
        </select>
      </div>
      <div class="field">
        <label for="title">Title</label>
        <input id="title" type="text" placeholder="A name the family will recognize" />
      </div>
      <div class="field">
        <label for="body">Memory</label>
        <textarea id="body" placeholder="Write freely. Uncertain dates: about / before / after / between — never invent."></textarea>
      </div>
      <div class="field">
        <label>Voice (stub)</label>
        <button class="btn btn-secondary" type="button">Hold to record (prototype)</button>
        <p class="hint">Elder-friendly: large tap target · captions later.</p>
      </div>
      <button class="btn btn-primary" type="submit">Submit for approval</button>
    </form>

  </main>
  <script src="../js/app.js"></script>
  
</body>
</html>
