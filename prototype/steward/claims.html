<!DOCTYPE html>
<html lang="en" data-base="..">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Member claims — Rootline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body data-shell="steward" data-active="claims">
  <div class="rl-app-bar" data-rl-app-bar></div>
  <main class="rl-main rl-main--wide" style="padding-bottom:3rem;">
<nav class="rl-steward-nav" data-rl-steward-nav aria-label="Steward"></nav>

    <p class="eyebrow">Membership</p>
    <h1>Member claims</h1>
    <div class="card-list" style="margin-top:1.25rem;">
      <div class="card queue-item">
        <div>
          <span class="badge badge-pending">Claim</span>
          <h3 style="margin-top:0.5rem;">Jordan Lee (SAMPLE claimant)</h3>
          <p class="meta">Asserts: great-grandchild of SAMPLE Margaret · voucher: none</p>
          <p class="hint">Docs: 1 photo stub uploaded</p>
        </div>
        <div class="btn-row" style="margin:0;">
          <button class="btn btn-primary" type="button">Approve</button>
          <button class="btn btn-ghost" type="button">Request changes</button>
          <button class="btn btn-danger" type="button">Decline</button>
        </div>
      </div>
      <div class="card">
        <span class="badge badge-ok">Invite pending confirm</span>
        <h3 style="margin-top:0.5rem;">Code SAMPLE-JOIN used</h3>
        <p class="meta">Member-issued · awaiting Steward confirm (product default)</p>
      </div>
    </div>
    <div class="field" style="margin-top:1.5rem;">
      <label for="reason">Audit reason (required on decision)</label>
      <textarea id="reason" placeholder="Why approve / decline / request changes…"></textarea>
    </div>

  </main>
  <script src="../js/app.js"></script>
  
</body>
</html>
